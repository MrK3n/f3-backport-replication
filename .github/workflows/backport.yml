name: Backport (replication of elastic/detection-rules mechanism)
on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: read

jobs:
  label:
    if: github.event.action != 'closed' || github.event.pull_request.merged != true
    runs-on: ubuntu-latest
    steps:
      - name: 'Apply default "backport: auto" label'
        uses: actions/github-script@v7
        with:
          script: |
            if (context.payload.pull_request.state == 'open' && !context.payload.pull_request.draft) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: ['backport: auto']
              });
            }

  commit:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'backport: auto')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          ref: main  # elastic original: token = secrets.WRITE_TRADEBOT_DETECTION_RULES_TOKEN (long-lived PAT); replication uses github.token — identical persist-credentials primitive
          fetch-depth: 100
      - name: git config
        run: |
          git config --global user.email "178941316+tradebot-elastic@users.noreply.github.com"
          git config --global user.name "tradebot-elastic"
      - name: Checkout merge commit
        run: git checkout ${{github.event.pull_request.merge_commit_sha}}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip cache purge
          pip install .[dev]
      - name: Run detection_rules-equivalent module
        run: python -m detection_rules dev unstage-incompatible-rules
      - name: Push to release branch
        run: |
          TARGET_BRANCH=8.19
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
